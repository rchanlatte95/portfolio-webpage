<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="description" content="Ryan Chanlatte - C/C++/C# Developer specializing in graphics programming, game development, and systems programming">
    <meta name="keywords" content="Ryan Chanlatte, Portfolio, C, C++, C#, Programming, Code, Game Development, Video Games, Aesthetics, Art, Video games as art">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e1e1e">
    <link rel="stylesheet" type="text/css" href="portfolio-style.css" />
    <title>Ryan Chanlatte | Home</title>
    <link rel="icon" type="image/x-icon" href="gwem.ico">
    
    <style>
        /* Homepage-specific styles */
        
        /* Initial hidden state - JS will add .loaded class to animate in */
        .page-wrapper {
            opacity: 0;
            transform: translateY(-15px);
            transition: opacity 0.7s ease-out, transform 0.7s ease-out;
        }
        
        .page-wrapper.loaded {
            opacity: 1;
            transform: translateY(0);
        }
        
        .hero-section {
            min-height: calc(100vh - 200px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .hero-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 3rem;
            padding: 2rem;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .hero-content {
            flex: 1;
            min-width: 300px;
            max-width: 500px;
        }
        
        .hero-image {
            flex: 0 0 auto;
        }
        
        .hero-image img {
            width: 270px;
            height: 480px;
            object-fit: cover;
            border-radius: 4px;
            border: 3px solid rgba(187, 134, 252, 0.3);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        .hero-image img:hover {
            border-color: var(--navbarForeground);
            box-shadow: 0 0 30px rgba(187, 134, 252, 0.3), 0 15px 50px rgba(0, 0, 0, 0.4);
            transform: translateY(-5px);
        }
        
        .hero-title {
            font-size: clamp(2rem, 5vw, 3.2rem);
            margin-bottom: 1.5rem;
            position: relative;
            display: inline-block;
        }
        
        .hero-title::before {
            content: '';
        }
        
        /* Typing cursor effect */
        .hero-title::after {
            content: '_';
            color: var(--navbarForeground);
            margin-left: 0.1em;
            font-weight: 400;
            animation: cursorBlink 1s step-end infinite !important;
        }
        
        @keyframes cursorBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        .hero-subtitle {
            color: var(--navbarForeground);
            font-family: var(--fontFamSS);
            font-size: 1rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }
        
        .hero-content p {
            text-align: left;
            max-width: 100%;
        }
        
        .hero-content a {
            color: var(--linkActive);
            text-decoration: none;
            position: relative;
            transition: all 0.2s ease;
        }
        
        .hero-content a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--linkActive);
            transition: width 0.2s ease;
        }
        
        .hero-content a:hover::after {
            width: 100%;
        }

        .hero-content a:hover {
            text-shadow: 0 0 10px rgba(152, 195, 121, 0.4);
        }

        /* Responsive */
        @media only screen and (max-width: 768px) {
            .hero-row {
                flex-direction: column-reverse;
                text-align: center;
                gap: 2rem;
            }
            
            .hero-content {
                text-align: center;
            }
            
            .hero-content p {
                text-align: center;
            }
            
            .hero-title::after {
                display: none;
            }
            
            .hero-image img {
                width: 220px;
                height: 390px;
            }
        }
    </style>
</head>

<body>

<div class="page-wrapper">
<nav class="topnav">
    <a class="active" href="index.html">About</a>
    <a href="Projects.html">Projects</a>
    <a href="Articles.html">Articles</a>
</nav>

<main class="hero-section">
    <div class="centerContainer">
        <div class="hero-row">
            <div class="hero-content">
                <p class="hero-subtitle">Hello, I'm</p>
                <h1 class="hero-title">Ryan Chanlatte</h1>
                <p>
                    I am a programmer with an interest in coding, video games, art, cooking, and philosophy. I have made a lot of games and like working on technical problems. Check out my <a href="Projects.html">projects</a> or <a href="Articles.html">articles</a>.
                </p>
            </div>
            <div class="hero-image">
                <img src="imgs/me.jpg" alt="Ryan Chanlatte">
            </div>
        </div>
    </div>
</main>

<footer>
    <div class="footerDiv">
        <a href="https://www.linkedin.com/in/ryan-a-chanlatte/" 
           class="socialButton" 
           role="button"
           target="_blank"
           rel="noopener noreferrer"
           style="background-color: #0077B5">
            LinkedIn
            <img src="./imgs/LinkedIn_In-White.png" alt="LinkedIn Logo" style="width: 32px; height: 32px;">
        </a>
        <a href="https://github.com/rchanlatte95" 
           class="socialButton" 
           role="button"
           target="_blank"
           rel="noopener noreferrer"
           style="background-color: #171515">
            Github
            <img src="./imgs/github-mark-white.png" alt="GitHub Logo" style="width: 32px; height: 32px;">
        </a>
    </div>
</footer>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Small delay to ensure styles are applied first
        requestAnimationFrame(function() {
            document.querySelector('.page-wrapper').classList.add('loaded');
        });
    });
</script>

</body>
</html>
